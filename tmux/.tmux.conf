set-option -g default-terminal "tmux-256color"
if-shell 'test -x /usr/bin/zsh' 'set-option -g default-shell /usr/bin/zsh'
set-option -sa terminal-features ',xterm-256color:RGB'
set -s escape-time 0
set-option -g focus-events on

bind r source-file ~/.tmux.conf
set -g base-index 1

set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'if [ -n "$WAYLAND_DISPLAY" ]; then wl-copy; else xclip -in -selection clipboard; fi'

# vim-like pane switching
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# forget the find window. That is for chumps
bind-key -r f run-shell "tmux neww tmux-sessionizer"

set -g mouse on
set -g status-right-length 100
set -g status-left-length 100

# PLUGINS
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'egel/tmux-gruvbox'
set -g @tmux-gruvbox 'dark'

# window name: current dir when idle in zsh, otherwise the running command
set -g status-interval 1
set -g automatic-rename on
set -g automatic-rename-format "#{?#{==:#{pane_current_command},zsh},#{b:pane_current_path},#{pane_current_command}}"

run '~/.tmux/plugins/tpm/tpm'

# the theme sets its own status-left/right, so clear them after it loads
set -g status-left ""
set -g status-right ""
